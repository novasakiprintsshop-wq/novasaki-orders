<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Invoice Record</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:system-ui,-apple-system,sans-serif}header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:3}header b{font-size:21px}header small{display:block;opacity:.7;margin-top:2px}main{max-width:760px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:white;border-radius:14px;padding:13px;box-shadow:0 2px 8px #0000000d}.stat span{font-size:12px;color:#667085}.stat strong{display:block;font-size:18px;margin-top:3px}.add{width:100%;border:0;border-radius:13px;background:#111827;color:white;font-weight:800;font-size:16px;padding:15px;margin:12px 0}.tabs{display:flex;gap:7px;margin-bottom:12px}.tabs button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:700;background:#e8edf5}.tabs .on{background:#111827;color:#fff}.invoice{margin-bottom:9px;cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px}.muted{font-size:12px;color:#667085;margin-top:3px}.amount{font-weight:800}.badge{display:inline-block;margin-top:8px;padding:4px 9px;border-radius:99px;font-size:11px;font-weight:800}.u{background:#fee2e2;color:#991b1b}.p{background:#dcfce7;color:#166534}.empty{text-align:center;color:#667085;padding:40px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end}.sheet{background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.sheet h2{margin:0 0 8px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:800}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}.form textarea{min-height:72px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:800}.dark{background:#111827;color:#fff}.light{background:#e8edf5}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.preview{width:100%;max-height:280px;object-fit:contain;border-radius:10px;margin-top:10px;background:#f3f4f6}.progress{font-size:12px;color:#667085;margin:8px 0}.ocr{font-size:11px;white-space:pre-wrap;background:#f3f4f6;padding:8px;border-radius:8px;max-height:100px;overflow:auto}.hide{display:none!important}footer{text-align:center;color:#98a2b3;font-size:11px;padding:20px}</style></head><body><header><b>🧾 Invoice Record</b><small>Scan • Record • Payment</small></header><main><div class="grid"><div class="card stat"><span>Invoices</span><strong id="count">0</strong></div><div class="card stat"><span>Paid</span><strong id="paid">RM0.00</strong></div><div class="card stat"><span>Unpaid</span><strong id="unpaid">RM0.00</strong></div></div><button class="add" onclick="openAdd()">📷 Scan / Add Invoice</button><div class="tabs"><button id="allTab" class="on" onclick="filterBy('ALL')">All</button><button id="uTab" onclick="filterBy('UNPAID')">🔴 Unpaid</button><button id="pTab" onclick="filterBy('PAID')">🟢 Paid</button></div><div id="list"></div></main><footer>Data is stored on this device. Unpaid invoices keep their photo; paid invoices keep the record but remove the photo.</footer>

<div class="modal" id="addModal"><div class="sheet"><h2>📷 Scan Invoice</h2><div class="progress" id="msg">Take a clear photo of the invoice.</div><input id="photo" type="file" accept="image/*" capture="environment" onchange="scan(this)"><img id="pic" class="preview hide"><div id="ocr" class="ocr hide"></div><button type="button" class="light" style="width:100%;margin-top:8px" onclick="retake()">📷 Retake / Scan Again</button><div class="form" style="margin-top:12px"><label>Invoice No.<input id="inv"></label><label>Customer<input id="cust"></label><label>Date<input id="dt" type="date"></label><label>Item<textarea id="itm"></textarea></label><label>Total (RM)<input id="amt" inputmode="decimal" type="number" step="0.01"></label><label>Payment Status<select id="st"><option value="UNPAID">🔴 UNPAID</option><option value="PAID">🟢 PAID</option></select></label></div><div class="actions"><button class="light" onclick="closeAdd()">Cancel</button><button class="dark" onclick="save()">💾 Save</button></div></div></div>

<div class="modal" id="viewModal"><div class="sheet"><h2>Invoice Details</h2><div id="details"></div><div class="actions"><button class="light" onclick="closeView()">Close</button><button id="payBtn"></button></div></div></div>

<script>
const DB='InvoiceRecordDB2',STORE='invoices';let db,mode='ALL',photoData=null,current=null;
function init(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function store(m='readonly'){return db.transaction(STORE,m).objectStore(STORE)}
function getAll(){return new Promise((ok,no)=>{let r=store().getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function put(x){return new Promise((ok,no)=>{let r=store('readwrite').put(x);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function add(x){return new Promise((ok,no)=>{let r=store('readwrite').add(x);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rm(n){return 'RM'+Number(n||0).toFixed(2)}
async function render(){let a=await getAll();a.sort((x,y)=>(y.date||'').localeCompare(x.date||''));let pa=a.filter(x=>x.status==='PAID'),un=a.filter(x=>x.status!=='PAID');count.textContent=a.length;paid.textContent=rm(pa.reduce((s,x)=>s+Number(x.amount||0),0));unpaid.textContent=rm(un.reduce((s,x)=>s+Number(x.amount||0),0));let shown=a.filter(x=>mode==='ALL'||x.status===mode);list.innerHTML=shown.length?shown.map(x=>'<div class="card invoice" onclick="view('+x.id+')"><div class="row"><div><b>'+esc(x.invNo||'No invoice no.')+'</b><div class="muted">'+esc(x.customer||'')+' • '+esc(x.date||'')+'</div></div><div class="amount">'+rm(x.amount)+'</div></div><span class="badge '+(x.status==='PAID'?'p':'u')+'">'+x.status+'</span></div>').join(''):'<div class="empty">No invoice records.</div>'}
function filterBy(x){mode=x;allTab.className=x==='ALL'?'on':'';uTab.className=x==='UNPAID'?'on':'';pTab.className=x==='PAID'?'on':'';render()}
function openAdd(){photoData=null;inv.value='';cust.value='';dt.value=new Date().toISOString().slice(0,10);itm.value='';amt.value='';st.value='UNPAID';pic.classList.add('hide');ocr.classList.add('hide');msg.textContent='Take a clear photo of the invoice.';addModal.style.display='flex'}
function closeAdd(){addModal.style.display='none'}
function retake(){photo.value='';photoData=null;pic.classList.add('hide');ocr.classList.add('hide');inv.value='';cust.value='';itm.value='';amt.value='';msg.textContent='Take a clearer photo. Keep the invoice flat, upright and well lit.';photo.click()}
function readPhoto(file){return new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(file)})}
async function scan(input){if(!input.files[0])return;const file=input.files[0];photoData=await readPhoto(file);pic.src=photoData;pic.classList.remove('hide');ocr.classList.remove('hide');msg.textContent='Smart Scan: preparing invoice…';try{const img=await loadImage(photoData),results=[];for(const deg of [0,90,270]){for(const mode of ['normal','enhanced']){msg.textContent='Smart Scan '+deg+'° '+mode+'…';const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),rad=deg*Math.PI/180,swap=deg===90||deg===270;canvas.width=(swap?img.height:img.width)*2;canvas.height=(swap?img.width:img.height)*2;ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(rad);ctx.drawImage(img,-img.width,-img.height,img.width*2,img.height*2);if(mode==='enhanced'){const data=ctx.getImageData(0,0,canvas.width,canvas.height),p=data.data;for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];const v=Math.max(0,Math.min(255,(g-128)*1.55+128));p[i]=p[i+1]=p[i+2]=v}ctx.putImageData(data,0,0)}const blob=await new Promise(ok=>canvas.toBlob(ok,'image/jpeg',.9));const z=await Tesseract.recognize(blob,'eng',{logger:x=>{if(x.status==='recognizing text')msg.textContent='Smart Scan '+deg+'° '+mode+' '+Math.round(x.progress*100)+'%'}});results.push({text:z.data.text,confidence:z.data.confidence||0,deg,mode})}}const score=x=>{const t=x.text.toLowerCase();let s=x.confidence*.25;s+=/invoice|inv|receipt/.test(t)?30:0;s+=/total|ttl|amount/.test(t)?30:0;s+=/customer|name|bill/.test(t)?15:0;s+=/date/.test(t)?15:0;s+=(t.match(/\\b\\d{1,2}[\\/.-]\\d{1,2}[\\/.-]\\d{2,4}\\b/g)||[]).length*8;s+=(t.match(/\\b\\d+[.]\\d{2}\\b/g)||[]).length*8;return s};results.sort((x,y)=>score(y)-score(x));const best=results[0];ocr.textContent=best.text;extract(best.text);msg.textContent='Smart Scan complete — please verify the highlighted fields before saving.'}catch(e){console.error(e);msg.textContent='Smart Scan failed. Please retake the photo upright and clearly.'}}
function loadImage(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
function extract(t){const lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean),clean=t.replace(/\s+/g,' ');let m=clean.match(/(?:invoice|inv|receipt|bill)[\s:#-]*([A-Z0-9][A-Z0-9\/_-]{2,})/i);if(m)inv.value=m[1];let q=clean.match(/(?:grand\s*total|total|amount\s*due|net\s*total|ttl)[^\d]{0,30}(\d[\d,]*(?:\.\d{1,2})?)/i);if(q)amt.value=q[1].replace(/,/g,'');let d=clean.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/);if(!d)d=clean.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](20\d{2})\b/);if(d){let yy=d[3],mm=d[2],dd=d[1];if(String(yy).length===4&&Number(mm)<=12&&Number(dd)<=31)dt.value=yy+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0')}let cc=lines.find(x=>/customer|bill\s*to|name\s*:/i.test(x));if(cc)cust.value=cc.replace(/.*?(customer|bill\s*to|name)\s*[:#-]?\s*/i,'').trim();const itemLines=lines.filter(x=>!/(invoice|date|total|thank|scan|shop|customer|bill\s*to)/i.test(x));if(itemLines.length)itm.value=itemLines.slice(0,5).join('\n');if(!inv.value||!amt.value)msg.textContent='Smart Scan found some text, but Invoice No. or Total needs checking.'}
async function saveasync function view(id){let a=await getAll();current=a.find(x=>x.id===id);details.innerHTML='<p><b>Invoice:</b> '+esc(current.invNo)+'</p><p><b>Customer:</b> '+esc(current.customer)+'</p><p><b>Date:</b> '+esc(current.date)+'</p><p><b>Item:</b><br>'+esc(current.item).replace(/\n/g,'<br>')+'</p><p><b>Total:</b> '+rm(current.amount)+'</p><p><b>Status:</b> <span class="badge '+(current.status==='PAID'?'p':'u')+'">'+current.status+'</span></p>'+(current.image?'<img class="preview" src="'+current.image+'">':'');payBtn.textContent=current.status==='PAID'?'Mark as UNPAID':'Mark as PAID';payBtn.className=current.status==='PAID'?'red':'green';payBtn.onclick=togglePay;viewModal.style.display='flex'}
function closeView(){viewModal.style.display='none'}
async function togglePay(){current.status=current.status==='PAID'?'UNPAID':'PAID';if(current.status==='PAID')delete current.image;await put(current);closeView();render()}
init().then(render);
</script></body></html>
